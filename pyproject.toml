[project]
name = "regnskap-agent"
version = "0.1.5"
description = "CLI og Codex-skill for trygge Fiken-regnskapsworkflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["certifi>=2025.10.5"]

[project.scripts]
regnskap = "regnskap_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
